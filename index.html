<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaalvoetbal</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f172a;color:#e5e7eb}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(160deg,#0f172a,#172554);min-height:100vh}
main{max-width:760px;margin:auto;padding:28px 16px 60px}
h1{text-align:center;font-size:38px;margin:8px 0}.sub{text-align:center;color:#94a3b8;margin-bottom:24px}
.card{background:#fff;color:#0f172a;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #0003}
form{display:flex;gap:10px}.input{flex:1;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;background:#16a34a;color:white}
button.secondary{background:#334155}button.danger{background:#dc2626}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.team{border-radius:16px;padding:16px;background:#f8fafc}
.team h2{margin:0 0 10px}.team1{border-top:6px solid #22c55e}.team2{border-top:6px solid #3b82f6}
ol{padding-left:25px;margin-bottom:0}.empty{color:#64748b}
.reserve{border-top:6px solid #f59e0b}
.admin{background:#111827;color:#e5e7eb}.admin input{border-color:#475569}
.small{font-size:13px;color:#64748b}.admin .small{color:#94a3b8}
#message{min-height:22px;text-align:center;font-weight:600}
@media(max-width:620px){.grid{grid-template-columns:1fr}form{flex-direction:column}h1{font-size:32px}}
</style>
</head>
<body>
<main>
  <h1>⚽ ZAALVOETBAL</h1>
  <div class="sub">Schrijf je in — de eerste 10 worden verdeeld over 2 teams.</div>

  <section class="card">
    <form id="form">
      <input id="name" class="input" maxlength="80" placeholder="Vul je naam in..." autocomplete="name" required>
      <button id="submit">INSCHRIJVEN</button>
    </form>
    <p id="message"></p>
  </section>

  <section class="grid">
    <div class="card team team1"><h2>🟢 Team 1 <span id="c1"></span></h2><ol id="team1"></ol></div>
    <div class="card team team2"><h2>🔵 Team 2 <span id="c2"></span></h2><ol id="team2"></ol></div>
  </section>

  <section class="card reserve">
    <h2>🟡 Invallers <span id="cr"></span></h2>
    <ol id="reserves"></ol>
    <p class="small">Vanaf inschrijving nummer 11. De volgorde is automatisch op basis van inschrijftijd.</p>
  </section>

  <section class="card admin">
    <h2>🔐 Beheer</h2>
    <div id="login">
      <form id="loginForm">
        <input id="password" class="input" type="password" placeholder="Admin-wachtwoord">
        <button class="secondary">Inloggen</button>
      </form>
    </div>
    <div id="panel" style="display:none">
      <p id="status"></p>
      <button id="toggle" class="secondary"></button>
      <button id="random" class="secondary">Teams opnieuw randomizen</button>
      <div id="adminPlayers"></div>
    </div>
  </section>
</main>
<script>
let adminPassword=null;
const $=id=>document.getElementById(id);

function render(s){
  $("c1").textContent=`(${s.teams[1].length}/5)`;
  $("c2").textContent=`(${s.teams[2].length}/5)`;
  $("cr").textContent=`(${s.reserves.length})`;
  $("team1").innerHTML=s.teams[1].map(p=>`<li>${esc(p.name)}</li>`).join("")||'<span class="empty">Nog niemand</span>';
  $("team2").innerHTML=s.teams[2].map(p=>`<li>${esc(p.name)}</li>`).join("")||'<span class="empty">Nog niemand</span>';
  $("reserves").innerHTML=s.reserves.map(p=>`<li>${esc(p.name)}</li>`).join("")||'<span class="empty">Nog geen invallers</span>';
  $("submit").disabled=!s.open;
  $("submit").textContent=s.open?"INSCHRIJVEN":"INSCHRIJVING GESLOTEN";
  if(adminPassword) renderAdmin(s);
}
function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
  const r=await fetch("/api/state"); render(await r.json());
}
$("form").addEventListener("submit",async e=>{
  e.preventDefault(); $("message").textContent="";
  const name=$("name").value.trim();
  try{
    const r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
    const data=await r.json(); if(!r.ok) throw new Error(data.error);
    $("name").value=""; $("message").textContent="✅ Je bent ingeschreven!";
    render(data);
  }catch(err){$("message").textContent="❌ "+err.message}
});
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); adminPassword=$("password").value;
  const r=await fetch("/api/admin/state",{headers:{"x-admin-password":adminPassword}});
  if(!r.ok){adminPassword=null; alert("Onjuist wachtwoord."); return}
  $("login").style.display="none";$("panel").style.display="block";render(await r.json());
});
async function adminAction(url,opts={}){
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),"x-admin-password":adminPassword}});
  const d=await r.json(); if(!r.ok) throw new Error(d.error); render(d);
}
function renderAdmin(s){
  $("status").textContent=s.open?"🟢 Inschrijving is OPEN":"🔴 Inschrijving is GESLOTEN";
  $("toggle").textContent=s.open?"Inschrijving sluiten":"Inschrijving openen";
  const all=[...s.teams[1].map(p=>({...p,team:1})),...s.teams[2].map(p=>({...p,team:2})),...s.reserves.map(p=>({...p,team:null}))];
  $("adminPlayers").innerHTML="<h3>Spelers</h3>"+(all.length?all.map(p=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #374151">${esc(p.name)} <button class="danger" onclick="removePlayer(${p.id})">Verwijderen</button></div>`).join(""):"Geen spelers");
}
$("toggle").onclick=()=>adminAction("/api/admin/toggle",{method:"POST"}).catch(e=>alert(e.message));
$("random").onclick=()=>adminAction("/api/admin/randomize",{method:"POST"}).catch(e=>alert(e.message));
async function removePlayer(id){
  if(confirm("Deze speler verwijderen?")) await adminAction("/api/admin/player/"+id,{method:"DELETE"});
}
load();
</script>
</body>
</html>
